version: '3.8'

services:
  automl-backend:
    build:
      context: ./automl-backend
      dockerfile: Dockerfile
    image: automl-backend-image
    container_name: automl-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/data/mlflow.db
      - JWT_SECRET=change-me-to-a-very-long-secure-random-string-in-production
      - MAX_UPLOAD_SIZE=52428800
      - MAX_DATASET_ROWS=500000
      - MAX_DATASET_COLS=500
    volumes:
      - automl-backend-data:/app/data
      - automl-backend-datasets:/app/datasets

  automl-frontend:
    build:
      context: ./automl-frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:8000
    container_name: automl-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - automl-backend

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: automl-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - automl-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - automl-backend

  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: automl-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - automl-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  mlflow:
    image: automl-backend-image
    container_name: automl-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: mlflow ui --backend-store-uri sqlite:////app/data/mlflow.db --host 0.0.0.0 --port 5000
    volumes:
      - automl-backend-data:/app/data
      - automl-backend-datasets:/app/datasets
    depends_on:
      - automl-backend

volumes:
  automl-backend-data:
  automl-backend-datasets:
  automl-prometheus-data:
  automl-grafana-data:
